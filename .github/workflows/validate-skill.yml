name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: pip install skills-ref

      - name: Validate SKILL.md against the Agent Skills spec
        run: python -m skills_ref.cli validate skills/keep-the-why

      - name: Validate evals.json is well-formed
        run: python -m json.tool skills/keep-the-why/evals/evals.json >/dev/null

      - name: Check version consistency across the repo
        run: |
          V=$(grep -oP '(?<=version: ")[0-9]+\.[0-9]+\.[0-9]+' skills/keep-the-why/SKILL.md | head -1)
          echo "Reference version (SKILL.md): $V"
          fail=0
          check() {
            v=$(grep -oP "$2" "$1" | head -1)
            if [ "$v" != "$V" ]; then
              echo "::error file=$1::version mismatch: found '$v', expected '$V'"
              fail=1
            fi
          }
          check plugin.json '(?<="version": ")[0-9]+\.[0-9]+\.[0-9]+'
          check .claude-plugin/plugin.json '(?<="version": ")[0-9]+\.[0-9]+\.[0-9]+'
          check llms.txt '(?<=^Version: )[0-9]+\.[0-9]+\.[0-9]+'
          check AGENTS.md '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          check skills/keep-the-why/references/setup.md '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          check skills/keep-the-why/references/repository-structure.md '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          check skills/keep-the-why/examples/first-time-setup.md '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          exit $fail
