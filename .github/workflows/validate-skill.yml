name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: pip install skills-ref==0.1.1

      - name: Validate SKILL.md against the Agent Skills spec
        run: python -m skills_ref.cli validate skills/keep-the-why

      - name: Validate evals.json is well-formed
        run: python -m json.tool tools/evals/evals.json >/dev/null

      - name: Check version consistency across the repo
        run: |
          V=$(grep -oP '(?<=version: ")[0-9]+\.[0-9]+\.[0-9]+' skills/keep-the-why/SKILL.md | head -1)
          echo "Reference version (SKILL.md): $V"
          fail=0
          check() {
            v=$(grep -oP "$2" "$1" | head -1)
            if [ "$v" != "$V" ]; then
              echo "::error file=$1::version mismatch: found '$v', expected '$V'"
              fail=1
            fi
          }
          check plugin.json '(?<="version": ")[0-9]+\.[0-9]+\.[0-9]+'
          check .claude-plugin/plugin.json '(?<="version": ")[0-9]+\.[0-9]+\.[0-9]+'
          check llms.txt '(?<=^Version: )[0-9]+\.[0-9]+\.[0-9]+'
          check .keep-the-why '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          check skills/keep-the-why/references/setup.md '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          check skills/keep-the-why/references/repository-structure.md '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          check skills/keep-the-why/examples/first-time-setup.md '(?<=context-schema: )[0-9]+\.[0-9]+\.[0-9]+'
          exit $fail

  lint-tests:
    name: keep-the-why-lint tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        working-directory: lint
        run: python -m unittest discover -s tests -v

      - name: Build and install the package
        working-directory: lint
        run: |
          python -m pip install --quiet build
          python -m build
          python -m pip install --quiet dist/*.whl
          ktw-lint --version

  lint-dogfood:
    name: keep-the-why-lint on this repo (from source, --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # From source, not via action.yml: the action installs the released
      # PyPI version, which would test yesterday's linter against today's
      # context/, not the code in this PR.
      - name: Lint this repository's own context/
        run: PYTHONPATH=lint python -m ktw_lint . --strict

      - name: Linter's supported schema must not lag behind the skill version
        run: |
          SKILL=$(grep -oP '(?<=version: ")[0-9]+\.[0-9]+\.[0-9]+' skills/keep-the-why/SKILL.md | head -1)
          LINT=$(PYTHONPATH=lint python -c "import ktw_lint; print('.'.join(map(str, ktw_lint.SUPPORTED_SCHEMA)))")
          echo "skill $SKILL / linter supports $LINT"
          if [ "$LINT" != "$SKILL" ]; then
            echo "::warning::linter SUPPORTED_SCHEMA ($LINT) differs from the skill version ($SKILL) — fine if this release has no structural change, otherwise add the gate and bump lint/ktw_lint/__init__.py"
          fi

  lint-action-smoke:
    name: root action.yml (consumer path, latest from PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The consumer path: exactly what `uses: oliver-zehentleitner/keep-the-why@latest`
      # does in someone else's repo — install the released linter from PyPI and run it.
      # Complements lint-dogfood (which tests the code in this PR from source).
      - name: Run the root action against this repository
        uses: ./
        with:
          path: "."
          strict: "false"
