[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-the-why-lint"
description = "Structural CI linter for Keep the Why projects: validates .keep-the-why and context/ entry structure, schema-version-aware."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oliver Zehentleitner" }]
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["keep-the-why", "linter", "documentation", "decision-records", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://keepthewhy.com"
Documentation = "https://keepthewhy.com/linting/"
Repository = "https://github.com/oliver-zehentleitner/keep-the-why"
Changelog = "https://github.com/oliver-zehentleitner/keep-the-why/blob/main/CHANGELOG.md"
Issues = "https://github.com/oliver-zehentleitner/keep-the-why/issues"

[project.scripts]
ktw-lint = "ktw_lint.cli:main"

[tool.setuptools]
packages = ["ktw_lint"]

[tool.setuptools.dynamic]
version = { attr = "ktw_lint.__version__" }
